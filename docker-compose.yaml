services:
  frontend:
    container_name: client
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - db
  backend:
    container_name: server
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'

  #helper:
  #  depends_on:
  #    - backend
  #ai:
  #  depends_on:
  #    - backend
  db:
    image: postgres:18-alpine
    container_name: hack_db
    restart: on-failure # lets give 2nd chance to db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" --quiet"]
      interval: 1s
      timeout: 5s
      retries: 5    
    env_file:
      - .env

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
