services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - db
  #backend:
  #  depends_on:
  #    db:
  #      condition: service_healthy
  #helper:
  #  depends_on:
  #    - backend
  db:
    image: postgres:18-alpine
    restart: on-failure # lets give 2nd chance to db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "--quiet"]
      interval: 1s
      timeout: 5s
      retries: 5    
    env_file:
      - .env

    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/docker

volumes:
  postgres-data: