services:
  frontend:
    container_name: client
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - '5173:5173'
  backend:
    container_name: server
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - AI_GRPC_TARGET=ai:50051
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      GRPC_PORT: '50051'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-2048}
    expose:
      - '50051'
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  db:
    image: postgres:18-alpine
    container_name: hack_db
    restart: on-failure # lets give 2nd chance to db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" --quiet"]
      interval: 1s
      timeout: 5s
      retries: 5    
    env_file:
      - .env

    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
