# Standalone deployment file: use -f docker-compose.prod.yaml, without the dev file.
services:
  frontend:
    image: mts-incident-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env (domain only, without https://)}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  backend:
    image: mts-incident-backend:prod
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ''
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      AI_GRPC_TARGET: ai:50051
      AUTH_COOKIE_SECURE: 'true'
      CORS_ORIGINS: '["https://${SITE_DOMAIN}"]'
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn main:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"

  ai:
    image: mts-incident-ai:prod
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    environment:
      GRPC_PORT: '50051'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-2048}
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mts_incidents}
      POSTGRES_USER: ${POSTGRES_USER:-mts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" --quiet"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
